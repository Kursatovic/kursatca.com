<figure class="scene"><h2>Lağım ve kuşatma kesiti</h2><p>Yaklaşma hattı, kazı ekibi, sur temeli ve karşı-lağımın kesitsel ilişkisi.</p><div class="image-wrap"><img src="../gorseller/semalar/lagim-kusatma-kesiti-ders-kitabi-v1.png" alt="Sur altındaki lağım tünelini ve karşı-lağımı gösteren ders kitabı çizimi"><a class="label" style="left:18%;top:25%" href="./atlas.html?birlik=azap&surum=28">Yaklaşma hattı</a><a class="label" style="left:39%;top:68%" href="./atlas.html?birlik=lagimci&surum=28">Lağımcılar</a><a class="label" style="left:67%;top:39%" href="./atlas.html?birlik=lagimci&surum=28">Sur temeli</a><a class="label" style="left:86%;top:72%" href="./atlas.html?birlik=lagimci&surum=28">Karşı-lağım</a></div><figcaption class="caption">Öğretim amaçlı çizim, birebir tarihsel sahne değildir.</figcaption><div class="warning">Şema yalnız yöntemi açıklar; uygulanabilir patlayıcı tarifi veya ölçüsü vermez.</div><div class="sources"><b>Kaynak künyesi</b><a href="https://islamansiklopedisi.org.tr/lagimci-ocagi" target="_blank" rel="noopener">TDV İA, “Lağımcı Ocağı”</a><a href="https://dergipark.org.tr/en/pub/firatsbed/article/544327" target="_blank" rel="noopener">Hakan Yıldız, arşiv temelli lağımcı araştırması</a></div></figure>
<figure class="scene"><h2>Tophâne’den cepheye</h2><p>Üretim, kontrol, top arabası, yolculuk ve cephe mürettebatının ortak işi.</p><div class="image-wrap transport"><img src="../gorseller/semalar/tophaneden-cepheye-ders-kitabi-v1.png" alt="Tophâne'den cepheye top taşıma sürecini gösteren ders kitabı çizimi"><a class="label" style="left:10%;top:13%" href="./atlas.html?birlik=topcu&surum=28">Tophâne</a><a class="label" style="left:29%;top:13%" href="./atlas.html?birlik=cebeci&surum=28">Kontrol</a><a class="label" style="left:49%;top:13%" href="./atlas.html?birlik=topArabacilari&surum=28">Top arabası</a><a class="label" style="left:68%;top:13%" href="./atlas.html?birlik=topArabacilari&surum=28">Nakliye</a><a class="label" style="left:89%;top:13%" href="./atlas.html?birlik=topcu&surum=28">Topçu mevzisi</a></div><figcaption class="caption">Öğretim amaçlı çizim, birebir tarihsel sahne değildir.</figcaption><div class="warning">Taşıma düzeni topun boyuna, yol koşullarına ve çekim gücüne göre değişirdi.</div><div class="sources"><b>Kaynak künyesi</b><a href="https://islamansiklopedisi.org.tr/top" target="_blank" rel="noopener">TDV İA, “Top”</a><a href="https://islamansiklopedisi.org.tr/tophane" target="_blank" rel="noopener">TDV İA, “Tophâne”</a></div></figure>
<figure class="scene"><h2>Ordugâh yerleşimi</h2><p>Komuta, birlikler, ikmal ve güvenlik halkalarının örnek ilişkisi.</p><div class="image-wrap"><img src="../gorseller/semalar/ordugah-yerlesimi-ders-kitabi-v1.png" alt="Osmanlı ordugâhını kuş bakışı gösteren ders kitabı çizimi"><a class="label" style="left:50%;top:24%" href="./atlas.html?birlik=garipler&surum=28">Komuta alanı</a><a class="label" style="left:19%;top:42%" href="./atlas.html?birlik=yeniceri&surum=28">Yeniçeriler</a><a class="label" style="left:19%;top:70%" href="./atlas.html?birlik=sipahi&surum=28">Sipahiler</a><a class="label" style="left:54%;top:76%" href="./atlas.html?birlik=cebeci&surum=28">İkmal</a><a class="label" style="left:82%;top:70%" href="./atlas.html?birlik=topcu&surum=28">Topçu alanı</a></div><figcaption class="caption">Öğretim amaçlı çizim, birebir tarihsel sahne değildir.</figcaption><div class="warning">Kaynaklar bu konuda ayrışır; ordugâhın yerleşimi sefere, araziye ve güvenlik ihtiyacına göre değişirdi.</div><div class="sources"><b>Kaynak künyesi</b><a href="https://islamansiklopedisi.org.tr/ordu#2-osmanli-donemi" target="_blank" rel="noopener">TDV İA, “Ordu — Osmanlı Dönemi”</a><a href="https://islamansiklopedisi.org.tr/kapikulu" target="_blank" rel="noopener">TDV İA, “Kapıkulu”</a></div></figure>
<figure class="scene"><h2>Sefer düzeni</h2><p>Öncü, merkez, kanatlar ve ağırlığın temel ilişkisi.</p><div class="image-wrap"><img src="../gorseller/semalar/sefer-duzeni-ders-kitabi-v1.png" alt="Osmanlı sefer düzenini kuş bakışı gösteren ders kitabı çizimi"><a class="label" style="left:49%;top:75%" href="./atlas.html?birlik=akinci&surum=28">Öncü: Akıncı · Azap</a><a class="label" style="left:50%;top:46%" href="./atlas.html?birlik=yeniceri&surum=28">Merkez: Yeniçeri</a><a class="label" style="left:50%;top:59%" href="./atlas.html?birlik=topcu&surum=28">Topçu desteği</a><a class="label" style="left:18%;top:50%" href="./atlas.html?birlik=sipahi&surum=28">Sağ kanat</a><a class="label" style="left:82%;top:50%" href="./atlas.html?birlik=sipahi&surum=28">Sol kanat</a><a class="label" style="left:50%;top:18%" href="./atlas.html?birlik=topArabacilari&surum=28">Ağırlık ve taşıma</a></div><figcaption class="caption">Öğretim amaçlı çizim, birebir tarihsel sahne değildir.</figcaption><div class="warning">Kaynaklar bu konuda ayrışır; kesin yerleşim savaşın türüne, araziye ve döneme göre değişebilirdi.</div><div class="sources"><b>Kaynak künyesi</b><a href="https://islamansiklopedisi.org.tr/ordu#2-osmanli-donemi" target="_blank" rel="noopener">TDV İA, “Ordu — Osmanlı Dönemi”</a><a href="https://islamansiklopedisi.org.tr/yeniceri" target="_blank" rel="noopener">TDV İA, “Yeniçeri”</a></div></figure>
