<script>
const q=new URLSearchParams(location.search),draft=q.get('taslak')==='1';const labels={tam:'3B',kart:'kart',planlandi:'plan'};
function find(node,name){if(!node)return null;if(Array.isArray(node)){for(const child of node){const hit=find(child,name);if(hit)return hit}return null}if(node.ad===name)return node;for(const child of node.cocuklar||[]){const hit=find(child,name);if(hit)return hit}return null}
function statusOf(node){return node.durum||'planlandi'}
function leaf(node,force){const status=statusOf(node),tag=node.birlik&&status!=='planlandi'?'a':'div',el=document.createElement(tag);el.className='leaf '+status+' force-'+force;el.innerHTML='<span>'+node.ad+'</span><em>'+labels[status]+'</em>';if(tag==='a')el.href='./atlas.html?birlik='+encodeURIComponent(node.birlik)+(draft?'&taslak=1':'')+'&surum=28';return el}
function leafList(nodes,force){const box=document.createElement('div');box.className='leaves';(nodes||[]).forEach(n=>box.append(leaf(n,force)));return box}
function category(title,nodes,force){const box=document.createElement('section');box.className='category force-'+force;box.innerHTML='<h2>'+title+'</h2>';box.append(leafList(nodes,force));return box}

const karaBox=document.createElement('section');karaBox.className='branch kara';karaBox.innerHTML='<i class="connector-note"></i><span class="branch-title">Kara Ordusu</span>';const grid=document.createElement('div');grid.className='kara-grid';const kapBox=document.createElement('section');kapBox.className='category';kapBox.innerHTML='<h2>Kapıkulu</h2>';const kg=document.createElement('div');kg.className='kapikulu-grid';[[yaya,'Kapıkulu Yaya Ocakları'],[suvari,'Kapıkulu Süvarileri']].forEach(([node,title])=>{const s=document.createElement('div');s.className='subcat';s.innerHTML='<h3>'+title+'</h3>';s.append(leafList(node?.cocuklar,'kapikulu'));kg.append(s)});kapBox.append(kg);grid.append(kapBox,category('Eyalet Kuvvetleri',eyalet?.cocuklar,'eyalet'),category('Yardımcı Kuvvetler',yard?.cocuklar,'yardimci'),category('Saray ve Ordu Hizmetleri',hizmet?.cocuklar,'saray'));karaBox.append(grid);
